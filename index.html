."},usage:{title:"Symbol Usage",desc:"On mobile devices, the SHOPLINE launch icon needs to occupy 75% of the icon display area to be displayed more clearly."},clearspace:{title:"Clear Space",desc:"To ensure the integrity and legibility of the SHOPLINE logo, it must be kept separate from other logos or competitive graphic elements such as body text that might conflict with, crowd, or diminish the overall effect of the logo.",point1:"Allow sufficient clear space around the logo equal to the height of the SHOPLINE symbol.",point2:"There should be sufficient clearance around the symbol, and the clearance height should be twice the height of the tag hole cover."},minSize:{title:"Minimum Size",desc:"To maintain maximum legibility at all times, the logo width should not be less than 100 pixels or 3.8 cm, while the symbol width should be at least 16 pixels or 0.6 cm."},colors:{title:"Logo Colors",desc:"The SHOPLINE logo is available in three color schemes: Dark Blue, Neutral, and White. The Dark Blue version is used on white or light backgrounds, while the White version is used on dark backgrounds. The Neutral version is used less frequently, but if used, ensure there is sufficient contrast between the logo color and the background color for the SHOPLINE logo to be clearly displayed. The most commonly used color code for the Dark Blue SHOPLINE logo is #00142D."},priority:{title:"Logo Usage",desc:"We recommend prioritizing the Dark Blue logo design style on light backgrounds. This style should be used whenever possible to maintain consistency in the company's visual image across different occasions. The priority of logo color usage is: Dark Blue > White > Neutral.",basic:"Basic: It is most commonly used to represent our brand because it contains the most information, with both an expressive symbol and an informative wordmark.",secondary:"Secondary: Used least frequently, typically for mobile applications."},backgrounds:{title:"Background Control",desc:"To ensure the SHOPLINE brand identity is clear and striking against different backgrounds, the contrast between the logo and the background is crucial. It is recommended to use the white logo on dark backgrounds, the dark blue logo on light backgrounds, and the logo on solid backgrounds. Enhance the contrast between the logo and the background to ensure it is easy to recognize.",correct:"Correct",incorrect:"Incorrect",c1:"Background contrasts sharply with logo",c2:"Background image has low saturation, contrasting with logo",c3:"Background content is cleaner and clearer",i1:"Background is too complex",i2:"Blurred background image",i3:"Background color is too similar to logo color"},placement:{title:"Logo Placement",desc:"Depending on the format and content of the application, placing the logo in a corner or in the center is acceptable. The preferred position is always the top corner. If this is not possible or would affect the design layout, the center or bottom corners can be used."},symbolPlacement:{title:"Symbol Placement",desc:"The position of the symbol depends on the specific usage scenario when it is used alone. The chart below outlines the size and position of the symbols in both horizontal and vertical layouts:"},watermark:{title:"Security Watermark",desc:"The security watermark is a symbol using the color #F7F8F9, placed in the center of the document."},lockups:{title:"Logo Lockups",desc:""},slogans:{title:"Slogans used in various regions",list:["1. Be part of the solution, no matter the problem.","2. Make it work first, then make it better.","3. Teamwork / Pursuit of Excellence / Active Communication","4. With a great team and culture, we can conquer the world.","5. The team and employees always come first.","6. Our success is built on the success of our merchants.","7. Empower merchants to succeed anywhere.","8. Merchant success is our success."]},cobranding:{title:"Co-branding for partnerships"},social:{title:"Social Media Icons",desc:"Application icons are individually designed to meet the requirements of each platform. The following two display styles are commonly used:",items:["When the display range is circular, the logo is used without any margins.","When the display range is square or rounded square, the logo should have appropriate margins on all sides, taking up 75% of the total space."],construction:"To ensure optimal visual communication of the logo, consider aligning the logo's centre both vertically and horizontally within the icon shape. Then, use the tab hole size to fill the left and right edges of the icon shape."}},zh:{downloadTitle:"标志文件下载",intro:{title:"标识",p1:"品牌标志是品牌身份的重要体现，它体现了品牌的愿景和信念。",p2:"SHOPLINE 的标志由英文字母和图形组成。“SHOP”一词强调了品牌所属行业，并且是“SHOPLINE”完整单词中的焦点，其中字母“O”以粗体显示。",p3:"字母“O”融入了“标签”的意象，强调了品牌与商店、商品和交易之间的联系。",p4:"为了营造对比效果和节奏感，“LINE”一词采用纤细的字体，象征着从厚重到轻盈的过渡，给人留下深刻的印象。SHOPLINE的标志独特、醒目且易于识别。",captions:["全彩标志","反白色标志","中性色标志","符号（主要用于手机、网页标签）"]},symbolism:{title:"象征",desc:"为了更好地展现SHOPLINE品牌的专业性和实力，标志中每条线条的角度都由设计师经过精准的美学计算精心雕琢。“标志”以45度角向上倾斜，象征着SHOPLINE与商界同舟共济、乘风破浪、勇往直前、昂首阔步迎接美好未来的精神。"},usage:{title:"符号使用",desc:"在移动设备上，SHOPLINE 启动图标需要占据图标显示区域的 75% 才能更清晰地显示。"},clearspace:{title:"空旷空间",desc:"为确保 SHOPLINE 标志的完整性和清晰度，必须将其与可能与标志冲突、拥挤或削弱标志整体效果的其他标志或正文等竞争性图形元素分开。",point1:"在标志周围留出足够的空白空间，该空间与 SHOPLINE 符号的高度相同。",point2:"符号周围应留出足够的净空，净空高度应为标签孔盖高度的两倍。"},minSize:{title:"最小尺寸",desc:"为始终保持最大清晰度，徽标的宽度不应小于 100 像素或 3.8 厘米，而符号的宽度应至少为 16 像素或 0.6 厘米。"},colors:{title:"标志颜色",desc:"SHOPLINE 标志有三种配色方案：深蓝色、中性色和白色。深蓝色版本用于白色或浅色背景，白色版本用于深色背景. 中性色版本使用较少，但如果使用，务必确保标志颜色与背景颜色之间有足够的对比度，以便清晰显示 SHOPLINE 标志. 深蓝色 SHOPLINE 标志最常用的颜色代码是 #00142D。"},priority:{title:"标志使用",desc:"我们建议优先采用浅色背景上的深蓝色标志设计风格. 应尽可能使用此风格，以保持公司在不同场合视觉形象的一致性. 标志颜色使用的优先顺序如下：深蓝色 > 白色 > 中性色。",basic:"基本的：它最常用于代表我们的品牌，因为它包含了最多的信息，既有富有表现力的符号，也有信息丰富的文字商标。",secondary:"次要：使用频率最低，通常用于移动应用"},backgrounds:{title:"背景控制",desc:"为了确保SHOPLINE品牌标识在不同背景下都能清晰醒目，标识与背景的对比度至关重要. 建议在深色背景上使用白色标识，在浅色背景上使用深蓝色标识，以及在纯色背景上使用标识. 增强标识与背景的对比度，确保其易于识别。",correct:"正确",incorrect:"错误",c1:"背景与标志形成鲜明对比",c2:"背景图像饱和度低，与标志形成对比",c3:"背景内容更简洁明了",i1:"背景过于复杂",i2:"模糊的背景图像",i3:"背景颜色与标志颜色过于相似"},placement:{title:"标志位置",desc:"根据应用程序的格式 and 内容，logo 放置在角落或中心位置都是可以接受的. 首选位置始终是顶部角落. 如果无法做到这一点或会影响设计布局，则可以使用中心或底部角落。"},symbolPlacement:{title:"符号放置",desc:"符号的位置取决于单独使用时的具体使用场景. 下图概述了符号在水平和垂直布局中的大小和位置："},watermark:{title:"安全水印",desc:"安全水印是一个使用 #F7F8F9 颜色的符号，放置在文档的中间。"},lockups:{title:"标志和标语",desc:""},slogans:{title:"各地区使用的口号",list:["1.无论遇到什么问题，都要成为解决方案的一部分。","2.先让它运转起来，然后再让它变得更好。","3.团队合作/追求卓越/积极沟通","4.凭借优秀的团队和企业文化，我们就能征服世界。","5.团队和员工永远是第一位的。","6.我们的成功建立在商家的成功之上。","7.助力商家在任何地方取得成功","8.商户的成功就是我们的成功"]},cobranding:{title:"合作伙伴联合品牌"},social:{title:"社交媒体图标",desc:"应用图标是根据每个平台的要求单独设计的. 以下两种显示样式通常被使用：",items:["当显示范围为圆形时，标志不留边距使用。","当显示范围为正方形或圆角正方形时，标志四周应留有适当的边距，占据总空间的 75%。"],construction:"为了确保标志的最佳视觉传达效果，请考虑将标志中心在图标形状内垂直和水平对齐. 然后，利用标签孔的大小来填充图标形状的左右边缘。"}}},fe=({src:d,alt:o,className:p,dark:r})=>{const A=async D=>{var L;D.preventDefault();try{const O=await(await fetch(d)).blob(),v=window.URL.createObjectURL(O),T=document.createElement("a");T.href=v;const C=((L=d.split("/").pop())==null?void 0:L.split("?")[0])||`SHOPLINE_${o.replace(/\s+/g,"_")}.png`;T.download=C,document.body.appendChild(T),T.click(),document.body.removeChild(T),window.URL.revokeObjectURL(v)}catch(B){console.error("Download failed",B),window.open(d,"_blank")}};return c.jsxs("div",{className:`relative group rounded-xl overflow-hidden border border-gray-100 ${p} ${r?"bg-[#00142D]":"bg-white"}`,children:[c.jsx("img",{src:d,alt:o,className:"w-full h-auto object-contain"}),c.jsx("button",{onClick:A,className:"absolute top-3 right-3 p-2 bg-white/90 backdrop-blur rounded-lg shadow-sm opacity-0 group-hover:opacity-100 transition-all hover:bg-white text-gray-700 z-10 hover:scale-105",title:"Download Image",children:c.jsx(Ce,{size:18})})]})},kd=({href:d,label:o,format:p})=>c.jsxs("a",{href:d,download:!0,className:"flex items-center justify-between p-4 border border-gray-200 rounded-xl hover:border-[#0061ff] hover:shadow-md group transition-all bg-white",children:[c.js
